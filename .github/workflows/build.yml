name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # We use MSBuild direct compilation while skipping asset targets to rely entirely on your local libs folder
    - name: Build Mod
      run: msbuild JonShift.csproj /p:Configuration=Release /p:ResolveNuGetPackages=false /p:SkipCompilerExecution=false
