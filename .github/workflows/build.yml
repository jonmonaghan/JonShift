name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Use a Windows runner instead of Linux
    runs-on: windows-latest

    steps:
    # 1. Pull the code down to the virtual machine
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Add MSBuild to the command line path
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Restore any NuGet packages if your project uses them
    - name: Restore NuGet Packages
      run: nuget restore

    # 4. Compile the mod using MSBuild
    - name: Build Mod
      run: msbuild /p:Configuration=Release
