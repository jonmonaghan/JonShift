name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Mod
      run: msbuild JonShift.csproj "/t:Restore;Build" /p:Configuration=Release

    - name: Remove development files
      shell: pwsh
      run: |
        Remove-Item "bin/Release/net472/*.pdb" -Force -ErrorAction SilentlyContinue

    - name: Upload Compiled Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaneShift-Mod
        path: |
          bin/Release/net472/LaneShifter.dll
