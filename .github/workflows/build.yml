name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Pull the code down to the virtual machine
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Add MSBuild to the command line path
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Generate the required project.assets.json file
    - name: Restore Project Dependencies
      run: dotnet restore JonShift.csproj

    # 4. Compile the mod using MSBuild 
    - name: Build Mod
      run: msbuild JonShift.csproj /p:Configuration=Release
