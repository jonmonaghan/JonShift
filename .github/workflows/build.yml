name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Added quotes around "/t:Restore;Build" to prevent PowerShell from splitting the command
    - name: Build Mod
      run: msbuild JonShift.csproj "/t:Restore;Build" /p:Configuration=Release

    - name: Upload Compiled Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaneShift-Mod-DLL
        path: bin/Release/net472/JonShift.dll
