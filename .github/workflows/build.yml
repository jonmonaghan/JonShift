name: Build Cities Skylines Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Using the modern dotnet restore handles Sdk-style projects perfectly
    - name: Restore Dependencies
      run: dotnet restore

    # MSBuild will now perfectly build the project with restored targets
    - name: Build Mod DLL
      run: msbuild JonShift.csproj /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Mod DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaneShift-Mod
        path: '**/bin/Release/**/*.dll'
