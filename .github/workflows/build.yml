name: Build Cities Skylines Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 1. Force generate the project.assets.json file without trying to find external NuGet packages
    - name: Restore Project Dependencies
      run: dotnet restore JonShift.csproj --use-current-runtime

    # 2. Build using MSBuild while explicitly passing the assembly location to the compiler
    - name: Build Mod
      run: msbuild JonShift.csproj /p:Configuration=Release /p:AdditionalLibPaths="D:\a\JonShift\JonShift\libs"
