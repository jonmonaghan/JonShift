name: Build C# DLL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Step 1: Download your repository code onto the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the .NET SDK environment
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Change to your preferred .NET version (e.g., 6.0, 7.0, 9.0)

    # Step 3: Restore dependencies (if you have NuGet packages)
    - name: Restore dependencies
      run: dotnet restore

    # Step 4: Compile the Class Library into a DLL
    - name: Build Project
      run: dotnet build --configuration Release

    # Step 5: Save the compiled DLL so you can download it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-compiled-dll
        path: '**/bin/Release/**/*.dll'
